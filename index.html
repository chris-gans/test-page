<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ich liebe Jenny ❤️</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jenny ❤️">
  <meta name="theme-color" content="#fff5f5">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(1.5rem, 5vh, 3rem);
      padding: 2rem 1.25rem;
      background: #fff5f5;
      color: #7a0d1e;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      text-align: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-size: clamp(2.6rem, 11vw, 7.5rem);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    h1 em {
      display: block;
      font-style: italic;
      color: #d90429;
    }

    .heart {
      width: clamp(180px, 55vw, 380px);
      height: auto;
      cursor: pointer;
      border: none;
      background: none;
      animation: beat 1.3s ease-in-out infinite;
      filter: drop-shadow(0 18px 30px rgba(217, 4, 41, 0.35));
      transform-origin: center;
    }

    .heart:focus-visible {
      outline: 3px dashed #d90429;
      outline-offset: 10px;
      border-radius: 12px;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.12); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.08); }
      60%      { transform: scale(1); }
    }

    /* Kleine Herzen, die beim Antippen aufsteigen */
    .mini {
      position: fixed;
      pointer-events: none;
      font-size: 1.6rem;
      color: #d90429;
      animation: float 2.2s ease-out forwards;
    }

    @keyframes float {
      from { transform: translate(-50%, 0) scale(0.6); opacity: 1; }
      to   { transform: translate(calc(-50% + var(--dx)), -60vh) scale(1.3); opacity: 0; }
    }

    .hint {
      font-family: Georgia, serif;
      font-size: 0.95rem;
      color: #b5485a;
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .heart { animation: none; }
      .mini  { display: none; }
    }
  </style>
</head>
<body>

  <h1>Ich liebe <em>Jenny</em></h1>

  <button class="heart" id="heart" aria-label="Herz antippen für mehr Liebe">
    <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff2e4d"/>
          <stop offset="100%" stop-color="#c1001f"/>
        </linearGradient>
      </defs>
      <path fill="url(#red)"
        d="M50 88 C20 66 2 50 2 28 C2 13 13 2 27 2 C37 2 45 8 50 16 C55 8 63 2 73 2 C87 2 98 13 98 28 C98 50 80 66 50 88 Z"/>
      <ellipse cx="28" cy="24" rx="10" ry="6" fill="#fff" opacity="0.25" transform="rotate(-30 28 24)"/>
    </svg>
  </button>

  <p class="hint">Tipp aufs Herz ❤️</p>

  <script>
    const heart = document.getElementById('heart');
    heart.addEventListener('click', () => {
      const rect = heart.getBoundingClientRect();
      for (let i = 0; i < 12; i++) {
        const m = document.createElement('span');
        m.className = 'mini';
        m.textContent = '❤';
        m.style.left = (rect.left + rect.width / 2) + 'px';
        m.style.top = (rect.top + rect.height / 2) + 'px';
        m.style.setProperty('--dx', (Math.random() * 300 - 150) + 'px');
        m.style.animationDelay = (i * 0.06) + 's';
        m.style.fontSize = (1 + Math.random() * 1.6) + 'rem';
        document.body.appendChild(m);
        setTimeout(() => m.remove(), 2600);
      }
    });
  </script>

</body>
</html>
